name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+pysqlite:///./ci.db
      JWT_SECRET: ci-secret-minimal-32-characters
      ENVIRONMENT: test
      DEBUG: "false"
      ADMIN_EMAIL: admin@poinqu.id
      ADMIN_PASSWORD: admin-password-123
      ADMIN_TOTP_SECRET: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
      FONNTE_WEBHOOK_SECRET: ci-webhook-secret-32-characters-min
      AUTO_CREATE_TABLES: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m compileall -q app tests alembic

      - name: Test
        run: python -m pytest -q

      - name: Alembic upgrade
        run: alembic upgrade head
