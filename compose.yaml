name: poinqu

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poinqu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poinqu}
      POSTGRES_DB: ${POSTGRES_DB:-poinqu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: poinqu-api:latest
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-poinqu}:${POSTGRES_PASSWORD:-poinqu}@db:5432/${POSTGRES_DB:-poinqu}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      APP_NAME: ${APP_NAME:-Poinqu API}
      APP_VERSION: ${APP_VERSION:-0.2.0}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-true}
      MIN_APP_VERSION: ${MIN_APP_VERSION:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:8000}
      ADMIN_NAME: ${ADMIN_NAME:-Superadmin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-owner@poinqu.id}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-password-123}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
      OTP_PROVIDER: ${OTP_PROVIDER:-}
      OTP_DEV_ECHO: ${OTP_DEV_ECHO:-false}
      FONNTE_TOKEN: ${FONNTE_TOKEN:-}
      FONNTE_BASE_URL: ${FONNTE_BASE_URL:-https://api.fonnte.com}
      FONNTE_TIMEOUT_SECONDS: ${FONNTE_TIMEOUT_SECONDS:-8}
      FONNTE_WEBHOOK_SECRET: ${FONNTE_WEBHOOK_SECRET:-}
      FONNTE_ALLOWED_IPS: ${FONNTE_ALLOWED_IPS:-}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
  media:
